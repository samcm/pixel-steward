version: 2
timezone: UTC

http:
  listen: 127.0.0.1:8080
  auth:
    mode: disabled

database:
  driver: memory

storage:
  driver: filesystem
  directory: ./data/objects

display:
  adapter: fake
  max_fps: 1
  # HTTP adapters may use immediate or buffered_stream publishing. Buffered
  # mode commits studio_publish transactions through a compatible proxy and
  # requires a stable source name for its producer lease.
  publish_mode: immediate
  source: pixel-steward
  # studio_watch samples locally at the requested rate, then turns complete
  # clips into resident device animations. The old clip remains on-screen while
  # the next is collected. Refresh limits apply to physical swaps, not sampling.
  live:
    clip_frames: 60
    frame_delay: 1s
    refresh_interval: 30m
    minimum_refresh: 5m
    restore_poll_interval: 10s
  blackout:
    start: "21:00"
    end: "09:00"

# Optional emergency/test override. It must be an absolute RFC3339 deadline and
# has no effect after it expires.
# operator:
#   test_window_until: "2030-01-01T22:30:00+10:00"

scheduler:
  default_lease: 24h
  selection: weighted_random
  avoid_immediate_repeat: true
  default_cooldown: 24h

inference:
  allowed_window:
    start: "09:00"
    end: "21:00"
  blackout_behavior: suspend
  # Model routing is a controller concern, independent of persona identity.
  model_profile: example-model
  default_thinking: low
  thinking_change_policy: operator_only
  lease_budget:
    max_input_tokens: 100000
    max_output_tokens: 20000
    max_model_calls: 16
    max_active_runtime: 20m
    max_model_scene_commits: 32
  per_call:
    max_output_tokens: 4096

runtime:
  driver: disabled
  workspace_root: ./data/workspaces
  # Hermes: command: [pixel-steward-hermes]

sandbox:
  driver: disabled
  local_root: ./data/sandboxes
  max_exec_time: 10m

model_profiles:
  example-model:
    provider: example
    model: example-model-id
    thinking:
      default: low
      allowed: [low, medium, high]
    billing:
      mode: unknown

personas:
  - id: example
    display_name: Example Persona
    enabled: true
    weight: 1
    cooldown: 24h
    soul: ./personas/example.md
